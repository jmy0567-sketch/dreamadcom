name: 네이버 블로그 최신 글 반영
on:
  schedule:
    - cron: "0 0,9 * * *"   # 매일 오전 9시·오후 6시(한국 시간)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/update_blog.py .
      - name: 바뀐 게 있으면 올리기
        run: |
          git config user.name "dreamadcom-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html cases.html
          git diff --cached --quiet || (git commit -m "블로그 최신 글 반영" && git push)
